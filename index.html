<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>La Esquizofrenia | Guía Visual y Abordaje Clínico</title>
  
  <meta name="description" content="Guía visual interactiva sobre la esquizofrenia: desmitificación, bases neurobiológicas, diagnóstico y abordaje integral." />

  <style>
    :root {
      --bg-dark: #0f172a;
      --bg-card: #1e293b;
      --bg-surface: #0b1120;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #0ea5e9;
      --accent-hover: #38bdf8;
      --border: rgba(148, 163, 184, 0.15);
      --shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5);
      --header-h: 64px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg-surface);
      color: var(--text-main);
      overflow-x: hidden;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* BARRA SUPERIOR */
    header {
      height: var(--header-h);
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1.25rem;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-weight: 600;
      font-size: 1.05rem;
      letter-spacing: -0.01em;
    }

    .brand-badge {
      background: linear-gradient(135deg, #0284c7, #2563eb);
      color: #fff;
      font-size: 0.72rem;
      text-transform: uppercase;
      font-weight: 700;
      padding: 0.2rem 0.55rem;
      border-radius: 999px;
      letter-spacing: 0.05em;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .btn {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 0.5rem 0.85rem;
      border-radius: 8px;
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      transition: all 0.2s ease;
      user-select: none;
    }

    .btn:hover {
      background: #334155;
      border-color: var(--accent);
      color: #fff;
    }

    .btn.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .btn-icon-only {
      padding: 0.5rem;
      min-width: 38px;
      justify-content: center;
    }

    /* BARRA DE PROGRESO */
    .progress-track {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 3px;
      background: rgba(255, 255, 255, 0.05);
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), #38bdf8);
      width: 6.66%;
      transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* CONTENEDOR PRINCIPAL */
    main {
      flex: 1;
      display: flex;
      position: relative;
    }

    /* MODO PRESENTACIÓN (SLIDESHOW) */
    .slideshow-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      position: relative;
    }

    .slide-wrapper {
      width: 100%;
      max-width: 1400px;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .slide-figure {
      position: relative;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      aspect-ratio: 16 / 9;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .slide-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      transition: opacity 0.25s ease;
    }

    .slide-meta {
      margin-top: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      max-width: 1400px;
      padding: 0 0.5rem;
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .slide-title-display {
      color: var(--text-main);
      font-weight: 500;
    }

    /* CONTROLES FLOTANTES LATERALES */
    .nav-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid var(--border);
      color: #fff;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
      z-index: 10;
    }

    .nav-arrow:hover {
      background: var(--accent);
      border-color: var(--accent);
      transform: translateY(-50%) scale(1.08);
    }

    .nav-arrow.prev { left: 1rem; }
    .nav-arrow.next { right: 1rem; }

    /* MODO SCROLL CONTINUO */
    .scroll-view {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 2.5rem;
      padding: 2.5rem 1rem 6rem;
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
    }

    .scroll-card {
      width: 100%;
      background: var(--bg-card);
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
    }

    .scroll-card header {
      position: static;
      height: auto;
      background: transparent;
      padding: 1rem 1.5rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .scroll-card-num {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 0.05em;
    }

    .scroll-card-title {
      font-size: 1rem;
      font-weight: 600;
      color: var(--text-main);
    }

    .scroll-card img {
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: contain;
      background: #000;
      display: block;
    }

    /* MODO CUADRÍCULA (GRID VIEW) */
    .grid-view {
      display: none;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1.5rem;
      padding: 2rem;
      width: 100%;
      max-width: 1400px;
      margin: 0 auto;
    }

    .grid-item {
      background: var(--bg-card);
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid var(--border);
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
    }

    .grid-item:hover {
      border-color: var(--accent);
      transform: translateY(-4px);
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
    }

    .grid-item.active {
      border: 2px solid var(--accent);
    }

    .grid-item img {
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: contain;
      background: #000;
    }

    .grid-item-info {
      padding: 0.85rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .grid-item-idx {
      font-size: 0.75rem;
      color: var(--accent);
      font-weight: 700;
    }

    .grid-item-name {
      font-size: 0.88rem;
      color: var(--text-main);
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* DRAWER / ÍNDICE LATERAL */
    .sidebar {
      position: fixed;
      top: var(--header-h);
      right: 0;
      width: 360px;
      height: calc(100vh - var(--header-h));
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-left: 1px solid var(--border);
      transform: translateX(100%);
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 150;
      display: flex;
      flex-direction: column;
    }

    .sidebar.open {
      transform: translateX(0);
    }

    .sidebar-head {
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .sidebar-title {
      font-size: 1rem;
      font-weight: 600;
    }

    .sidebar-list {
      list-style: none;
      overflow-y: auto;
      flex: 1;
      padding: 0.75rem;
    }

    .sidebar-item {
      padding: 0.75rem 1rem;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      gap: 0.75rem;
      align-items: center;
      font-size: 0.875rem;
      color: var(--text-muted);
      transition: all 0.15s ease;
      margin-bottom: 0.25rem;
    }

    .sidebar-item:hover {
      background: rgba(255, 255, 255, 0.05);
      color: #fff;
    }

    .sidebar-item.current {
      background: rgba(14, 165, 233, 0.15);
      color: var(--accent);
      font-weight: 600;
    }

    .sidebar-num {
      font-weight: 700;
      min-width: 24px;
      font-size: 0.8rem;
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 140;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }

    .overlay.visible {
      opacity: 1;
      pointer-events: auto;
    }

    /* FOOTER TECLADO */
    .keyboard-hint {
      position: fixed;
      bottom: 1rem;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding: 0.4rem 0.9rem;
      border-radius: 999px;
      border: 1px solid var(--border);
      font-size: 0.75rem;
      color: var(--text-muted);
      display: flex;
      gap: 1rem;
      pointer-events: none;
      opacity: 0.75;
      transition: opacity 0.2s;
    }

    kbd {
      background: #334155;
      padding: 0.15rem 0.35rem;
      border-radius: 4px;
      color: #fff;
      font-family: inherit;
    }

    @media (max-width: 768px) {
      .keyboard-hint {
        display: none;
      }
      .nav-arrow {
        width: 40px;
        height: 40px;
      }
      .nav-arrow.prev { left: 0.25rem; }
      .nav-arrow.next { right: 0.25rem; }
      .slideshow-container {
        padding: 0.75rem;
      }
      .sidebar {
        width: 85vw;
      }
      .brand-title {
        display: none;
      }
    }
  </style>
</head>
<body>

  <!-- BARRA DE NAVEGACIÓN -->
  <header>
    <div class="brand">
      <span class="brand-badge">Clinical Briefing</span>
      <span class="brand-title">Comprender la Esquizofrenia</span>
    </div>

    <div class="nav-actions">
      <!-- Selector de vistas -->
      <button class="btn active" id="btnModeSlide" title="Modo Diapositivas">
        <svg width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
          <path d="M1 2.5A1.5 1.5 0 0 1 2.5 1h11A1.5 1.5 0 0 1 15 2.5v9a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 1 11.5v-9zM2.5 2a.5.5 0 0 0-.5.5v9a.5.5 0 0 0 .5.5h11a.5.5 0 0 0 .5-.5v-9a.5.5 0 0 0-.5-.5h-11z"/>
          <path d="M8 5a.5.5 0 0 1 .5.5v2.793l1.146-1.147a.5.5 0 0 1 .708.708l-2 2a.5.5 0 0 1-.708 0l-2-2a.5.5 0 1 1 .708-.708L7.5 8.293V5.5A.5.5 0 0 1 8 5z"/>
        </svg>
        <span>Láminas</span>
      </button>

      <button class="btn" id="btnModeScroll" title="Modo Documento Continuo">
        <svg width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
          <path fill-rule="evenodd" d="M4.5 2a.5.5 0 0 0-.5.5v11a.5.5 0 0 0 .5.5h7a.5.5 0 0 0 .5-.5v-11a.5.5 0 0 0-.5-.5h-7zm-1-.5A1.5 1.5 0 0 1 4.5 0h7A1.5 1.5 0 0 1 13 1.5v13a1.5 1.5 0 0 1-1.5 1.5h-7A1.5 1.5 0 0 1 3 14.5v-13z"/>
          <path d="M5 4h6v1H5V4zm0 3h6v1H5V7zm0 3h4v1H5v-1z"/>
        </svg>
        <span>Lectura</span>
      </button>

      <button class="btn" id="btnModeGrid" title="Ver Cuadrícula">
        <svg width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
          <path d="M1 2.5A1.5 1.5 0 0 1 2.5 1h3A1.5 1.5 0 0 1 7 2.5v3A1.5 1.5 0 0 1 5.5 7h-3A1.5 1.5 0 0 1 1 5.5v-3zm8 0A1.5 1.5 0 0 1 10.5 1h3A1.5 1.5 0 0 1 15 2.5v3A1.5 1.5 0 0 1 13.5 7h-3A1.5 1.5 0 0 1 9 5.5v-3zm-8 8A1.5 1.5 0 0 1 2.5 9h3A1.5 1.5 0 0 1 7 10.5v3A1.5 1.5 0 0 1 5.5 15h-3A1.5 1.5 0 0 1 1 13.5v-3zm8 0A1.5 1.5 0 0 1 10.5 9h3a1.5 1.5 0 0 1 1.5 1.5v3a1.5 1.5 0 0 1-1.5 1.5h-3A1.5 1.5 0 0 1 9 13.5v-3z"/>
        </svg>
      </button>

      <button class="btn btn-icon-only" id="btnFullscreen" title="Pantalla Completa (F)">
        <svg width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
          <path fill-rule="evenodd" d="M1.5 1a.5.5 0 0 0-.5.5v4a.5.5 0 0 1-1 0v-4A1.5 1.5 0 0 1 1.5 0h4a.5.5 0 0 1 0 1h-4zM10 .5a.5.5 0 0 1 .5-.5h4A1.5 1.5 0 0 1 16 1.5v4a.5.5 0 0 1-1 0v-4a.5.5 0 0 0-.5-.5h-4a.5.5 0 0 1-.5-.5zM.5 10a.5.5 0 0 1 .5.5v4a.5.5 0 0 0 .5.5h4a.5.5 0 0 1 0 1h-4A1.5 1.5 0 0 1 0 14.5v-4a.5.5 0 0 1 .5-.5zm15 0a.5.5 0 0 1 .5.5v4a1.5 1.5 0 0 1-1.5 1.5h-4a.5.5 0 0 1 0-1h4a.5.5 0 0 0 .5-.5v-4a.5.5 0 0 1 .5-.5z"/>
        </svg>
      </button>

      <button class="btn" id="btnToggleSidebar" title="Índice de Contenido">
        <svg width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
          <path fill-rule="evenodd" d="M2.5 12a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5zm0-4a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5zm0-4a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5z"/>
        </svg>
        <span>Índice</span>
      </button>
    </div>

    <div class="progress-track">
      <div class="progress-bar" id="progressBar"></div>
    </div>
  </header>

  <!-- CONTENIDO -->
  <main>
    <!-- VISTA 1: MODO PRESENTACIÓN -->
    <section class="slideshow-container" id="slideshowView">
      <button class="nav-arrow prev" id="arrowPrev" title="Anterior (←)">
        <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </button>

      <div class="slide-wrapper">
        <figure class="slide-figure">
          <img id="mainSlideImg" src="Comprender_la_Esquizofrenia001.png" alt="Diapositiva clínica" class="slide-img" />
        </figure>
      </div>

      <button class="nav-arrow next" id="arrowNext" title="Siguiente (→ / Espacio)">
        <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
          <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
      </button>

      <div class="slide-meta">
        <span class="slide-counter" id="slideCounterDisplay">Lámina 1 de 15</span>
        <span class="slide-title-display" id="slideTitleDisplay">Portada y presentación</span>
      </div>
    </section>

    <!-- VISTA 2: MODO LECTURA / SCROLL CONTINUO -->
    <section class="scroll-view" id="scrollView"></section>

    <!-- VISTA 3: MODO CUADRÍCULA -->
    <section class="grid-view" id="gridView"></section>
  </main>

  <!-- OVERLAY Y SIDEBAR -->
  <div class="overlay" id="overlay"></div>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-head">
      <div class="sidebar-title">Estructura del Informe</div>
      <button class="btn btn-icon-only" id="btnCloseSidebar">✕</button>
    </div>
    <ul class="sidebar-list" id="sidebarList"></ul>
  </aside>

  <!-- HINT TECLADO -->
  <div class="keyboard-hint">
    <span><kbd>←</kbd> <kbd>→</kbd> Navegar</span>
    <span><kbd>F</kbd> Pantalla completa</span>
    <span><kbd>G</kbd> Cuadrícula</span>
    <span><kbd>Esc</kbd> Cerrar</span>
  </div>

  <script>
    // Datos de las 15 láminas
    const slidesData = [
      { num: 1, file: "Comprender_la_Esquizofrenia001.png", title: "Portada: Desmitificación, diagnóstico y abordaje" },
      { num: 2, file: "Comprender_la_Esquizofrenia002.png", title: "Realidad clínica frente al mito popular" },
      { num: 3, file: "Comprender_la_Esquizofrenia003.png", title: "Origen histórico: Fragmentación de funciones mentales" },
      { num: 4, file: "Comprender_la_Esquizofrenia004.png", title: "Ventana crítica de debut clínico (Adolescencia y Juventud)" },
      { num: 5, file: "Comprender_la_Esquizofrenia005.png", title: "Modelo multifactorial de vulnerabilidad cruzada" },
      { num: 6, file: "Comprender_la_Esquizofrenia006.png", title: "Carga y vulnerabilidad genética basal (1%, 10%, 50%)" },
      { num: 7, file: "Comprender_la_Esquizofrenia007.png", title: "Detonantes ambientales que cruzan el umbral" },
      { num: 8, file: "Comprender_la_Esquizofrenia008.png", title: "Desequilibrio neuroquímico y estructural del cerebro" },
      { num: 9, file: "Comprender_la_Esquizofrenia009.png", title: "La dualidad de los síntomas: Positivos vs. Negativos" },
      { num: 10, file: "Comprender_la_Esquizofrenia010.png", title: "Manifestaciones productivas frente a deficitarias" },
      { num: 11, file: "Comprender_la_Esquizofrenia011.png", title: "El impacto invisible en las funciones ejecutivas" },
      { num: 12, file: "Comprender_la_Esquizofrenia012.png", title: "Diagnóstico clínico y criterios DSM-5 / CIE-11" },
      { num: 13, file: "Comprender_la_Esquizofrenia013.png", title: "Ecosistema de tratamiento integral e interconectado" },
      { num: 14, file: "Comprender_la_Esquizofrenia014.png", title: "Entorno físico y sonoro como herramienta terapéutica" },
      { num: 15, file: "Comprender_la_Esquizofrenia015.png", title: "Validar la emoción sin reforzar la creencia delirante" }
    ];

    let currentIndex = 0;
    let currentMode = "slide"; // "slide", "scroll", "grid"

    // Elementos DOM
    const mainSlideImg = document.getElementById("mainSlideImg");
    const slideCounterDisplay = document.getElementById("slideCounterDisplay");
    const slideTitleDisplay = document.getElementById("slideTitleDisplay");
    const progressBar = document.getElementById("progressBar");

    const slideshowView = document.getElementById("slideshowView");
    const scrollView = document.getElementById("scrollView");
    const gridView = document.getElementById("gridView");

    const btnModeSlide = document.getElementById("btnModeSlide");
    const btnModeScroll = document.getElementById("btnModeScroll");
    const btnModeGrid = document.getElementById("btnModeGrid");
    const btnFullscreen = document.getElementById("btnFullscreen");

    const btnToggleSidebar = document.getElementById("btnToggleSidebar");
    const btnCloseSidebar = document.getElementById("btnCloseSidebar");
    const sidebar = document.getElementById("sidebar");
    const overlay = document.getElementById("overlay");
    const sidebarList = document.getElementById("sidebarList");

    const arrowPrev = document.getElementById("arrowPrev");
    const arrowNext = document.getElementById("arrowNext");

    // Inicializar listas e interfaces
    function init() {
      renderSidebar();
      renderScrollView();
      renderGridView();
      updateSlide(0);
    }

    // Renderizar Índice Lateral
    function renderSidebar() {
      sidebarList.innerHTML = slidesData.map((s, idx) => `
        <li class="sidebar-item ${idx === currentIndex ? 'current' : ''}" data-idx="${idx}">
          <span class="sidebar-num">${s.num.toString().padStart(2, '0')}</span>
          <span class="sidebar-text">${s.title}</span>
        </li>
      `).join("");

      sidebarList.querySelectorAll(".sidebar-item").forEach(item => {
        item.addEventListener("click", () => {
          const idx = parseInt(item.getAttribute("data-idx"), 10);
          goToSlide(idx);
          closeSidebar();
        });
      });
    }

    // Renderizar Modo Lectura (Scroll)
    function renderScrollView() {
      scrollView.innerHTML = slidesData.map((s) => `
        <article class="scroll-card" id="scroll-slide-${s.num}">
          <header>
            <span class="scroll-card-num">LÁMINA ${s.num.toString().padStart(2, '0')}</span>
            <h2 class="scroll-card-title">${s.title}</h2>
          </header>
          <img src="${s.file}" alt="${s.title}" loading="lazy" />
        </article>
      `).join("");
    }

    // Renderizar Modo Cuadrícula (Grid)
    function renderGridView() {
      gridView.innerHTML = slidesData.map((s, idx) => `
        <div class="grid-item ${idx === currentIndex ? 'active' : ''}" data-idx="${idx}">
          <img src="${s.file}" alt="${s.title}" loading="lazy" />
          <div class="grid-item-info">
            <span class="grid-item-idx">LÁMINA ${s.num.toString().padStart(2, '0')}</span>
            <span class="grid-item-name" title="${s.title}">${s.title}</span>
          </div>
        </div>
      `).join("");

      gridView.querySelectorAll(".grid-item").forEach(item => {
        item.addEventListener("click", () => {
          const idx = parseInt(item.getAttribute("data-idx"), 10);
          goToSlide(idx);
          setMode("slide");
        });
      });
    }

    // Actualizar diapositiva activa
    function updateSlide(index) {
      if (index < 0) index = 0;
      if (index >= slidesData.length) index = slidesData.length - 1;
      currentIndex = index;

      const slide = slidesData[currentIndex];
      mainSlideImg.style.opacity = "0.3";
      
      setTimeout(() => {
        mainSlideImg.src = slide.file;
        mainSlideImg.alt = slide.title;
        mainSlideImg.style.opacity = "1";
      }, 120);

      slideCounterDisplay.textContent = `Lámina ${slide.num} de ${slidesData.length}`;
      slideTitleDisplay.textContent = slide.title;

      const progress = ((currentIndex + 1) / slidesData.length) * 100;
      progressBar.style.width = `${progress}%`;

      // Actualizar sidebar actual
      document.querySelectorAll(".sidebar-item").forEach((item, i) => {
        item.classList.toggle("current", i === currentIndex);
      });

      // Actualizar grid item actual
      document.querySelectorAll(".grid-item").forEach((item, i) => {
        item.classList.toggle("active", i === currentIndex);
      });
    }

    function goToSlide(index) {
      updateSlide(index);
      if (currentMode === "scroll") {
        const target = document.getElementById(`scroll-slide-${slidesData[index].num}`);
        if (target) {
          target.scrollIntoView({ behavior: "smooth", block: "center" });
        }
      }
    }

    function nextSlide() {
      if (currentIndex < slidesData.length - 1) {
        updateSlide(currentIndex + 1);
      }
    }

    function prevSlide() {
      if (currentIndex > 0) {
        updateSlide(currentIndex - 1);
      }
    }

    // Cambiar modos de visualización
    function setMode(mode) {
      currentMode = mode;
      btnModeSlide.classList.toggle("active", mode === "slide");
      btnModeScroll.classList.toggle("active", mode === "scroll");
      btnModeGrid.classList.toggle("active", mode === "grid");

      slideshowView.style.display = mode === "slide" ? "flex" : "none";
      scrollView.style.display = mode === "scroll" ? "flex" : "none";
      gridView.style.display = mode === "grid" ? "grid" : "none";

      if (mode === "scroll") {
        const target = document.getElementById(`scroll-slide-${slidesData[currentIndex].num}`);
        if (target) {
          target.scrollIntoView({ behavior: "auto", block: "start" });
        }
      }
    }

    // Sidebar
    function openSidebar() {
      sidebar.classList.add("open");
      overlay.classList.add("visible");
    }

    function closeSidebar() {
      sidebar.classList.remove("open");
      overlay.classList.remove("visible");
    }

    // Pantalla completa
    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    }

    // Eventos
    btnModeSlide.addEventListener("click", () => setMode("slide"));
    btnModeScroll.addEventListener("click", () => setMode("scroll"));
    btnModeGrid.addEventListener("click", () => setMode("grid"));
    btnFullscreen.addEventListener("click", toggleFullscreen);

    arrowPrev.addEventListener("click", prevSlide);
    arrowNext.addEventListener("click", nextSlide);

    btnToggleSidebar.addEventListener("click", openSidebar);
    btnCloseSidebar.addEventListener("click", closeSidebar);
    overlay.addEventListener("click", closeSidebar);

    // Navegación por teclado
    window.addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight" || e.key === "PageDown" || e.key === " ") {
        if (currentMode === "slide") {
          e.preventDefault();
          nextSlide();
        }
      } else if (e.key === "ArrowLeft" || e.key === "PageUp") {
        if (currentMode === "slide") {
          e.preventDefault();
          prevSlide();
        }
      } else if (e.key === "Home") {
        goToSlide(0);
      } else if (e.key === "End") {
        goToSlide(slidesData.length - 1);
      } else if (e.key.toLowerCase() === "f") {
        toggleFullscreen();
      } else if (e.key.toLowerCase() === "g") {
        setMode(currentMode === "grid" ? "slide" : "grid");
      } else if (e.key === "Escape") {
        closeSidebar();
      }
    });

    // Gestos táctiles (Swipe en móviles)
    let touchStartX = 0;
    let touchEndX = 0;

    slideshowView.addEventListener("touchstart", (e) => {
      touchStartX = e.changedTouches[0].screenX;
    }, { passive: true });

    slideshowView.addEventListener("touchend", (e) => {
      touchEndX = e.changedTouches[0].screenX;
      handleSwipe();
    }, { passive: true });

    function handleSwipe() {
      const threshold = 45;
      if (touchEndX < touchStartX - threshold) {
        nextSlide();
      } else if (touchEndX > touchStartX + threshold) {
        prevSlide();
      }
    }

    // Ejecutar al cargar
    init();
  </script>
</body>
</html>
